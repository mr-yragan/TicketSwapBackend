services:
  postgres:
    image: postgres:17
    container_name: ticketswap-postgres
    environment:
      POSTGRES_DB: ticketswap
      POSTGRES_USER: ticketswap
      POSTGRES_PASSWORD: ticketswap
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketswap -d ticketswap"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ticketswap-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: ticketswap-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: .
    container_name: ticketswap-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketswap
      SPRING_DATASOURCE_USERNAME: ticketswap
      SPRING_DATASOURCE_PASSWORD: ticketswap
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      TICKETSWAP_JWT_SECRET: ${TICKETSWAP_JWT_SECRET:?Set TICKETSWAP_JWT_SECRET in .env}
      TICKETSWAP_STORAGE_S3_ENDPOINT: http://minio:9000
      TICKETSWAP_STORAGE_S3_ACCESS_KEY: minioadmin
      TICKETSWAP_STORAGE_S3_SECRET_KEY: minioadmin123
      TICKETSWAP_STORAGE_S3_BUCKET: ticketswap-ticket-files
      TICKETSWAP_STORAGE_S3_PUBLIC_ENDPOINT: http://localhost:9000
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      TICKETSWAP_PARTNER_API_BASE_URL: http://127.0.0.1:8080
      TICKETSWAP_MOCK_PARTNER_ENABLED: ${TICKETSWAP_MOCK_PARTNER_ENABLED:-true}
      TICKETSWAP_MOCK_PARTNER_INTERNAL_TOKEN: ${TICKETSWAP_MOCK_PARTNER_INTERNAL_TOKEN:?Set TICKETSWAP_MOCK_PARTNER_INTERNAL_TOKEN in .env}
      TICKETSWAP_BOOTSTRAP_ADMIN_ENABLED: ${TICKETSWAP_BOOTSTRAP_ADMIN_ENABLED:-false}
      TICKETSWAP_BOOTSTRAP_ADMIN_EMAIL: ${TICKETSWAP_BOOTSTRAP_ADMIN_EMAIL:-}
      TICKETSWAP_BOOTSTRAP_ADMIN_LOGIN: ${TICKETSWAP_BOOTSTRAP_ADMIN_LOGIN:-}
      TICKETSWAP_BOOTSTRAP_ADMIN_PASSWORD: ${TICKETSWAP_BOOTSTRAP_ADMIN_PASSWORD:-}
      TICKETSWAP_SEARCH_ELASTICSEARCH_ENABLED: "true"
      TICKETSWAP_SEARCH_ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
      TICKETSWAP_SEARCH_ELASTICSEARCH_INDEX_NAME: ticketswap-events
    ports:
      - "8080:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketswap-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  minio-data:
