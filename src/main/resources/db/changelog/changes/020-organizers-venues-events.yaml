databaseChangeLog:
  - changeSet:
      id: 020-create-organizers-venues-events
      author: nikolay
      changes:
        - createTable:
            tableName: organizers
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: organizer_code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: api_key_hash
                  type: varchar(255)
              - column:
                  name: api_key_last4
                  type: varchar(4)
              - column:
                  name: api_key_created_at
                  type: timestamp with time zone
              - column:
                  name: contact_email
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: organizers
            columnNames: organizer_code
            constraintName: uq_organizers_organizer_code
        - addUniqueConstraint:
            tableName: organizers
            columnNames: contact_email
            constraintName: uq_organizers_contact_email
        - createTable:
            tableName: venues
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: timezone
                  type: varchar(64)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: venues
            columnNames: name, address, timezone
            constraintName: uq_venues_name_address_timezone
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: venue_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: organizer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: starts_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: date
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: venue_id
            referencedTableName: venues
            referencedColumnNames: id
            constraintName: fk_events_venue
        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: organizer_id
            referencedTableName: organizers
            referencedColumnNames: id
            constraintName: fk_events_organizer
        - addUniqueConstraint:
            tableName: events
            columnNames: organizer_id, event_id
            constraintName: uq_events_organizer_event_id
        - createIndex:
            tableName: events
            indexName: idx_events_organizer_starts_at
            columns:
              - column:
                  name: organizer_id
              - column:
                  name: starts_at
              - column:
                  name: id
