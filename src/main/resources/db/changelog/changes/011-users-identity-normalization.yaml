databaseChangeLog:
  - logicalFilePath: changes/009-users-identity-normalization.yaml
  - changeSet:
      id: 9-normalize-user-identifiers
      author: nikolay
      preConditions:
        - onFail: HALT
        - onError: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: |
              SELECT COUNT(*)
              FROM (
                  SELECT lower(btrim(email))
                  FROM users
                  GROUP BY lower(btrim(email))
                  HAVING COUNT(*) > 1
              ) duplicate_normalized_emails
      changes:
        - sql:
            sql: |
              UPDATE users
              SET email = lower(btrim(email))
              WHERE email <> lower(btrim(email));
        - sql:
            sql: |
              ALTER TABLE users
              ADD CONSTRAINT chk_users_email_normalized
              CHECK (email = lower(btrim(email)));
